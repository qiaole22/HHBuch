:root{--g:linear-gradient(135deg,#0f2b46,#1f5f99)}

</style></head><body>
<header><button id="pm">‹</button><b id="ml"></b><button id="nm">›</button><span class="sp"></span><button id="sy">⟳</button><button id="cf">⚙</button><button id="ex" title="Excel-Export">⬇</button></header>

<script src="exceljs.min.js"></script>
<script>

const rows=cs.map(c=>`<p class="cr"><span><i class="dot" style="background:${CC[c[0]]}"></i>${SH[c[0]]}</span><b>${fm(tot(c[0]))} <small>${Math.round(tot(c[0])/ex*100)}%</small></b></p>`).join('');
return `<div class="card hero"><small>Noch verfügbar</small><b class="${left<0?'neg':''}">${fm(left)}</b><div class="bar"><i style="width:${pc}%"></i></div><div class="hs"><span>⬆ ${fm(inc)}</span><span>⬇ ${fm(ex)}</span></div></div><div class="card"><h3>Ausgaben nach Kategorie</h3>`+(ex?`<div class="dn"><svg viewBox="0 0 100 100">${ring}</svg><div class="dc"><small>Ausgaben</small><b>${fm(ex)}</b></div></div>${rows}`:'<p class="mu">Noch keine Ausgaben – tippe auf ＋</p>')+'</div>'}
function list(e,i){const all=[...e.map(x=>({...x,k:'e'})),...i.map(x=>({...x,k:'i',d:x.d||1}))].sort((a,b)=>b.d-a.d||b.u-a.u);
if(!all.length)return '<p class="mu" style="text-align:center;margin:30px 0">Noch keine Buchungen.<br>Tippe auf ＋</p>';let h='',cur=0;
for(const x of all){if(x.d!=cur){cur=x.d;const t=all.filter(z=>z.d==cur).reduce((p,z)=>p+(z.k=='i'?z.a:-z.a),0);h+=`<div class="dh"><span>${dayLbl(cur)}</span><span>${t>0?'+':''}${fm(t)}</span></div>`}
const inc=x.k=='i';h+=`<div class="tx" data-id="${x.id}"><span class="ic" style="background:${inc?'#dff5e8':CL[x.c]}">${inc?'💰':EM[x.c]}</span><span class="td">${esc(x.t)||(inc?'Einnahme':SH[x.c])}<small>${inc?'Einnahme':SH[x.c]}</small></span><b class="${inc?'pos':''}">${inc?'+':'−'}${fm(x.a)}</b></div>`}return h}
function table(e){const[y,m]=month.split('-'),n=new Date(y,m,0).getDate();let rem=sm(I()),tot=0,h='<div class="tw"><table><tr><th></th>'+CATS.map(c=>`<th colspan="2">${c[1]}</th>`).join('')+'<th class="g">Daily Total</th><th class="g">Remaining</th><th class="g">Total Spent</th></tr>';
for(let d=1;d<=n;d++){const de=e.filter(x=>x.d==d),dy=sm(de);rem-=dy;tot+=dy;

function acc(){const v=ACC.map(k=>S.s[month+'|'+k]?.a||0),t=v.reduce((p,x)=>p+x,0),pm=pmo(-1),has=ACC.some(k=>S.s[pm+'|'+k]),pt=ACC.reduce((p,k)=>p+(S.s[pm+'|'+k]?.a||0),0);

function render(){if(document.activeElement?.dataset?.k&&$('v').contains(document.activeElement))return;const[y,m]=month.split('-'),e=E(),i=I();
$('ml').textContent=new Date(y,m-1).toLocaleDateString('de-DE',{month:'long',year:'numeric'});
document.querySelectorAll('nav [data-v]').forEach(b=>b.classList.toggle('on',b.dataset.v==view));document.body.dataset.v=view;
$('v').innerHTML=({o:()=>(cfg.token?'':'<div class="card" data-sync="1" style="cursor:pointer">☁️ Auf allen Geräten nutzen – hier tippen</div>')+over(e,i),l:()=>'<div class="card">'+list(e,i)+'</div>',t:()=>table(e),k:acc})[view]()}
const mk_=(k,n)=>k+'|'+n.trim().toLowerCase(),cap=n=>n.charAt(0).toUpperCase()+n.slice(1);
function seed(){for(const k of['e','i'])for(const r of Object.values(S[k])){if(r.x||!r.t||r.t=='Einnahme')continue;const key=mk_(k,r.t);if(!S.m[key])S.m[key]={n:r.t,c:r.c||'',k,cnt:1,u:r.u}}}

function openSheet(o={}){sh={id:'',type:'e',amt:'',c:'',step:1,skip:false,date:month==ds(0).slice(0,7)?ds(0):month+'-01',t:'',...o};draw();$('ov').classList.add('on')}

const enc=s=>btoa(unescape(encodeURIComponent(s))),dec=s=>decodeURIComponent(escape(atob(s.replace(/\n/g,''))));

async function sync(n=0){if(!cfg.token)return;$('sy').textContent='…';

localStorage.hb=JSON.stringify(S);render();const txt=JSON.stringify(S);
if(txt!=rt){const p=await gh('PUT',{message:'sync',content:enc(txt),sha});if((p.status==409||p.status==422)&&n<3)return sync(n+1);if(!p.ok)throw p.status}

async function setup(){if(cfg.repo)return;const H={Authorization:'Bearer '+cfg.token,Accept:'application/vnd.github+json'},A='https://api.github.com/';

if(r.status==404){const c=await fetch(A+'user/repos',{method:'POST',headers:H,body:JSON.stringify({name:n,private:true,auto_init:true,description:'Haushaltsbuch Daten'})});if(!c.ok)throw c.status}else if(!r.ok)throw r.status;
cfg.repo=L+'/'+n;localStorage.hbcfg=JSON.stringify(cfg)}
function dlg(){$('dg').innerHTML=cfg.token?`<p><b>✓ Verbunden</b><br><small>${esc(cfg.repo||'')}</small></p><button class="pri" id="d1">Jetzt synchronisieren</button><button id="d2">📱 Anderes Gerät koppeln</button><button id="d3">Trennen</button><button id="d0">Schließen</button>`:`<p><b>☁️ Synchronisieren</b></p><p>1. <a href="https://github.com/settings/tokens/new?scopes=repo&description=Haushaltsbuch" target="_blank">Token erstellen</a> – unten „Generate token“ tippen und den Token kopieren.</p><p>2. Hier einfügen:</p><input id="gt" placeholder="ghp_…"><button class="pri" id="d4">Verbinden</button><button id="d0">Schließen</button>`}
$('dg').onclick=async ev=>{const i=ev.target.id;if(i=='d0')$('dg').close();else if(i=='d1'){$('dg').close();sync()}
else if(i=='d2'){const l=location.origin+location.pathname+'#k='+cfg.token;if(navigator.share)navigator.share({url:l,title:'Haushaltsbuch'}).catch(()=>{});else{await navigator.clipboard.writeText(l);alert('Link kopiert – auf dem anderen Gerät öffnen.')}}
else if(i=='d3'){cfg={};localStorage.removeItem('hbcfg');dlg();render()}
